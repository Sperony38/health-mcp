[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "health-mcp"
version = "0.1.0"
description = "Remote MCP server for laboratory analyses with MariaDB persistence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.0,<2.0",
  "pydantic>=2.7,<3.0",
  "PyMySQL>=1.1,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "starlette>=0.46,<1.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/health_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

